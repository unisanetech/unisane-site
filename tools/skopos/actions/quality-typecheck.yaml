{
  "id": "quality.typecheck",
  "title": "Typecheck Site source",
  "description": "Run the repository-owned TypeScript proof for Site application and package or config changes.",
  "category": "quality-check",
  "scope": [
    "workspace"
  ],
  "command": "pnpm typecheck",
  "cwd": ".",
  "timeoutMs": 900000,
  "inputs": [
    "apps/web",
    "package.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "turbo.json",
    "tsconfig.json"
  ],
  "sourceExcludes": [],
  "outputs": [],
  "outputExcludes": [],
  "affects": [],
  "capabilities": {
    "process": "required",
    "network": "none",
    "browser": "none",
    "tools": [
      "pnpm"
    ],
    "secrets": [],
    "services": []
  },
  "effects": {
    "workspace": "none",
    "artifacts": "none",
    "external": "none"
  },
  "concurrency": "shared",
  "workspaceMode": "overlay-safe",
  "safety": "read-only",
  "requiresApproval": false,
  "whenToUse": "Require for Site source, TypeScript, package, dependency, lockfile, or build-graph changes.",
  "phases": [
    "closure"
  ],
  "risks": [
    "light",
    "standard",
    "high-impact"
  ],
  "recommendedAfter": [],
  "owner": "site-maintainers"
}
