{
  'id': 'repository.cold-checkout',
  'title': 'Verify cold checkout, frozen install, and CI command parity',
  'description': 'Archive exact committed source into a disposable no-remote Git checkout, install from an empty task-local store, and run the registered provider-neutral CI command sequence.',
  'category': 'quality-check',
  'scope': ['workspace'],
  'command': 'pnpm check:cold-checkout',
  'cwd': '.',
  'timeoutMs': 1800000,
  'inputs':
    [
      '.gitattributes',
      '.gitignore',
      '.node-version',
      'apps/web',
      'docs/reference/generated/site-local-readiness-baseline.json',
      'eslint.config.mjs',
      'package.json',
      'pnpm-lock.yaml',
      'pnpm-workspace.yaml',
      'scripts',
      'skopos.config.yaml',
      'tools/skopos',
      'tsconfig.json',
      'turbo.json',
      'vitest.config.mjs',
    ],
  'sourceExcludes': [],
  'outputs': [],
  'outputExcludes': [],
  'affects': [],
  'capabilities':
    {
      'process': 'required',
      'network': 'required',
      'browser': 'none',
      'tools': ['node', 'git', 'tar', 'pnpm'],
      'secrets': [],
      'services': [],
    },
  'effects': { 'workspace': 'none', 'artifacts': 'none', 'external': 'none' },
  'concurrency': 'exclusive',
  'workspaceMode': 'overlay-safe',
  'safety': 'read-only',
  'requiresApproval': false,
  'whenToUse': 'Require for package, lockfile, workspace, provider-neutral CI command, or cold-checkout harness changes. Registry access retrieves public packages only; ambient credentials are not forwarded.',
  'phases': ['stabilization', 'closure'],
  'risks': ['standard', 'high-impact'],
  'recommendedAfter': ['repository.boundary'],
  'owner': 'site-maintainers',
}
