{
  'id': 'site.local-readiness',
  'title': 'Verify local Site routes, semantics, SEO, and baselines',
  'description': 'Build and verify the retained route set, local journeys, static targets, mechanical accessibility and SEO evidence, and non-evaluated performance, bundle, and image baselines.',
  'category': 'quality-check',
  'scope': ['workspace'],
  'command': 'pnpm verify:local-readiness',
  'cwd': '.',
  'timeoutMs': 900000,
  'inputs':
    [
      'apps/web',
      'docs/reference/generated/site-local-readiness-baseline.json',
      'package.json',
      'pnpm-lock.yaml',
      'pnpm-workspace.yaml',
      'scripts/check-local-readiness.mjs',
      'turbo.json',
    ],
  'sourceExcludes': [],
  'outputs': ['apps/web/.next'],
  'outputExcludes': [],
  'affects': ['apps/web/.next'],
  'capabilities':
    {
      'process': 'required',
      'network': 'none',
      'browser': 'none',
      'tools': ['pnpm', 'node'],
      'secrets': [],
      'services': [],
    },
  'effects':
    { 'workspace': 'declared', 'artifacts': 'none', 'external': 'none' },
  'concurrency': 'exclusive',
  'workspaceMode': 'overlay-safe',
  'safety': 'mutating',
  'requiresApproval': true,
  'whenToUse': 'Require for retained routes, navigation, semantics, SEO metadata, static assets, readiness checks, or the local readiness baseline. Timing observations never imply a threshold pass.',
  'phases': ['stabilization', 'closure'],
  'risks': ['light', 'standard', 'high-impact'],
  'recommendedAfter': ['quality.typecheck'],
  'owner': 'site-maintainers',
}
